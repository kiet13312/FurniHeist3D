name: Build FurniHeist3D 3D Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable 3D debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore packed GLB model assets
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          cat models3d-bundle-parts/part*.txt | base64 --decode > /tmp/furni-models.zip.zst
          zstd --decompress --force /tmp/furni-models.zip.zst --output=/tmp/furni-models.zip
          mkdir -p /tmp/furni-models-extracted models3d app/src/main/assets/models3d
          unzip -oq /tmp/furni-models.zip -d /tmp/furni-models-extracted
          cp -a /tmp/furni-models-extracted/models3d/. models3d/
          cp -a /tmp/furni-models-extracted/models3d/. app/src/main/assets/models3d/
          test "$(find app/src/main/assets/models3d -type f -name '*.glb' | wc -l)" -eq 17

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurniHeist3D-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
