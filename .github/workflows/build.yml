name: Build FurniHeist3D 3D Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore packed GLB assets
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          cat models3d-bundle-parts/part*.txt | base64 --decode > /tmp/furni-models.zip.zst
          zstd --decompress --force /tmp/furni-models.zip.zst -o /tmp/furni-models.zip
          mkdir -p /tmp/furni-models-extracted models3d
          unzip -oq /tmp/furni-models.zip -d /tmp/furni-models-extracted
          cp -a /tmp/furni-models-extracted/models3d/. models3d/
          test "$(find models3d -type f -name '*.glb' | wc -l)" -eq 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Three.js game module and model URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert re.search(r"<!doctype html>", html, re.I), "Missing HTML doctype"
          assert re.search(r'<canvas[^>]+id=["\']world["\']', html), "WebGL world canvas missing"
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, re.I)
          assert scripts, "No game module found"
          module = scripts[-1]
          for path in re.findall(r"'(models3d/[^']+\.glb)'", module):
              assert Path(path).is_file(), f"Missing GLB: {path}"
          assert len(list(Path("models3d").rglob("*.glb"))) == 17, "Expected all 17 GLB models"
          Path("/tmp/furniheist3d.mjs").write_text(module, encoding="utf-8")
          print(f"Validated WebGL game ({len(html)} characters) and 17 GLB files")
          PY
          node --check /tmp/furniheist3d.mjs
          node --check vendor/three.module.js
          node --check vendor/GLTFLoader.js
          node --check vendor/BufferGeometryUtils.js
          test -s vendor/three.module.js
          test -s vendor/GLTFLoader.js
          test -s vendor/BufferGeometryUtils.js

      - name: Package browser game
        run: |
          mkdir -p dist
          cp index.html README.md dist/
          cp -a models3d dist/models3d
          cp -a vendor dist/vendor
          cd dist
          zip -qr ../FurniHeist3D-web.zip .

      - name: Upload playable web build
        uses: actions/upload-artifact@v4
        with:
          name: FurniHeist3D-web-build
          path: FurniHeist3D-web.zip
          if-no-files-found: error
          retention-days: 14
